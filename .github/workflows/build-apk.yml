name: Build and Publish Automate AI Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Automate AI Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js and build Automate AI web bundle
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Automate AI frontend assets
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          java -version

          VERSION_OUTPUT="$(java -version 2>&1)"
          FIRST_LINE="$(printf '%s\n' "$VERSION_OUTPUT" | head -n 1)"

          if [[ "$FIRST_LINE" =~ \"1\.([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          elif [[ "$FIRST_LINE" =~ \"([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          else
            echo "ERROR: Unable to detect active Java version from: $FIRST_LINE" >&2
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java ${JAVA_MAJOR}." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Automate AI Android project
        shell: bash
        run: |
          set -euo pipefail

          # Accept Android SDK licenses if sdkmanager is available on the runner
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

          # Scaffold Gradle + AGP 9.1.1 Android :app wrapper when the repo only contains web source
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            mkdir -p gradle
            cat > gradle/libs.versions.toml <<'EOF'
          [versions]
          agp = "9.1.1"

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          EOF

            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

            cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Automate-AI"
          include(":app")
          EOF

            cat > build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application) apply false
          }
          EOF

            mkdir -p app
            cat > app/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application)
          }

          android {
              namespace = "com.automateai.app"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.automateai.app"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              signingConfigs {
                  getByName("debug") {
                      val ks = rootProject.file("debug.keystore")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = "android"
                          keyAlias = "androiddebugkey"
                          keyPassword = "android"
                      }
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
          fi

          # Populate Android resources, Automate AI branding, logo icons, and bundled web assets
          mkdir -p app/src/main/java/com/automateai/app \
                   app/src/main/res/values \
                   app/src/main/res/mipmap-anydpi-v26 \
                   app/src/main/assets/www

          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            rm -rf app/src/main/assets/www/*
            cp -r dist/. app/src/main/assets/www/
          else
            echo "ERROR: Built web bundle dist/index.html is missing." >&2
            exit 1
          fi

          if [ ! -f "app/src/main/assets/www/index.html" ]; then
            echo "ERROR: app/src/main/assets/www/index.html was not copied into Android assets." >&2
            exit 1
          fi

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#F8F5F2</color>
              <color name="splash_background">#090A14</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Automate AI</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AutomateAI" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/splash_background</item>
                  <item name="android:statusBarColor">@color/splash_background</item>
                  <item name="android:navigationBarColor">@color/splash_background</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # Generate Android launcher icons from the new Automate AI reference logo
          python3 -m venv "${RUNNER_TEMP}/pyvenv"
          "${RUNNER_TEMP}/pyvenv/bin/pip" install --quiet pillow
          "${RUNNER_TEMP}/pyvenv/bin/python" - <<'PYEOF'
          import os
          from PIL import Image, ImageDraw

          logo_path = "public/assets/aistudio/Gemini_Generated_Image_ee5hycee5hycee5h_050d414c.png"
          bg_color = (248, 245, 242, 255)
          if os.path.isfile(logo_path):
              src = Image.open(logo_path).convert("RGBA")
              w, h = src.size
              corner = src.getpixel((min(12, w - 1), min(12, h - 1)))
              bg_color = (corner[0], corner[1], corner[2], 255)
              # Tight centered square crop on the A + infinity emblem (excludes outer margins & corner watermark)
              crop_size = max(128, int(min(w, h) * 0.60))
              left = max(0, (w - crop_size) // 2)
              top = max(0, (h - crop_size) // 2)
              logo = src.crop((left, top, left + crop_size, top + crop_size))
          else:
              logo = Image.new("RGBA", (512, 512), (168, 20, 48, 255))

          densities = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432),
          }

          for density, (icon_px, fg_px) in densities.items():
              out_dir = f"app/src/main/res/mipmap-{density}"
              os.makedirs(out_dir, exist_ok=True)

              # Adaptive foreground (seamless studio background inside safe zone)
              fg_canvas = Image.new("RGBA", (fg_px, fg_px), bg_color)
              safe_size = int(fg_px * 0.68)
              resized_fg = logo.resize((safe_size, safe_size), Image.Resampling.LANCZOS)
              offset_fg = ((fg_px - safe_size) // 2, (fg_px - safe_size) // 2)
              fg_canvas.paste(resized_fg, offset_fg, resized_fg)
              fg_canvas.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG")

              # Legacy square rounded icon
              sq = Image.new("RGBA", (icon_px, icon_px), (0, 0, 0, 0))
              sq_bg = Image.new("RGBA", (icon_px, icon_px), bg_color)
              legacy_logo_size = int(icon_px * 0.86)
              resized_legacy = logo.resize((legacy_logo_size, legacy_logo_size), Image.Resampling.LANCZOS)
              offset_legacy = ((icon_px - legacy_logo_size) // 2, (icon_px - legacy_logo_size) // 2)
              sq_bg.paste(resized_legacy, offset_legacy, resized_legacy)
              sq_mask = Image.new("L", (icon_px, icon_px), 0)
              ImageDraw.Draw(sq_mask).rounded_rectangle(
                  [0, 0, icon_px - 1, icon_px - 1],
                  radius=max(4, int(icon_px * 0.22)),
                  fill=255,
              )
              sq.paste(sq_bg, (0, 0), sq_mask)
              sq.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")

              # Legacy circular icon
              rd = Image.new("RGBA", (icon_px, icon_px), (0, 0, 0, 0))
              rd_mask = Image.new("L", (icon_px, icon_px), 0)
              ImageDraw.Draw(rd_mask).ellipse([0, 0, icon_px - 1, icon_px - 1], fill=255)
              rd.paste(sq_bg, (0, 0), rd_mask)
              rd.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

          print("Generated new Automate AI reference launcher icons across all mipmap densities.")
          PYEOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AutomateAI"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/automateai/app/MainActivity.java <<'EOF'
          package com.automateai.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.Dialog;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Message;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {

              private static final String LOCAL_APP_HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + LOCAL_APP_HOST + "/index.html";
              private static final int REQ_FILE_CHOOSER = 1001;
              private static final int REQ_MEDIA_PERMISSIONS = 1002;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingPermissionRequest;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.parseColor("#090A14"));
                  window.setNavigationBarColor(Color.parseColor("#090A14"));

                  if ((getApplicationInfo().flags & ApplicationInfo.FLAG_DEBUGGABLE) != 0) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#090A14"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  String ua = settings.getUserAgentString();
                  if (ua != null) {
                      String cleanUa = ua
                              .replace("; wv)", ")")
                              .replace("; wv", "")
                              .replaceAll("Version/\\d+\\.\\d+\\s*", "");
                      settings.setUserAgentString(cleanUa);
                  }

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          if (request == null || request.getUrl() == null) {
                              return super.shouldInterceptRequest(view, request);
                          }
                          Uri uri = request.getUrl();
                          if (!"https".equalsIgnoreCase(uri.getScheme())
                                  || !LOCAL_APP_HOST.equalsIgnoreCase(uri.getHost())) {
                              return super.shouldInterceptRequest(view, request);
                          }

                          String rawPath = uri.getPath();
                          if (rawPath == null || rawPath.isEmpty() || "/".equals(rawPath)) {
                              rawPath = "/index.html";
                          }

                          String cleanPath = rawPath.startsWith("/") ? rawPath.substring(1) : rawPath;
                          if (cleanPath.contains("..")) {
                              return textResponse(403, "Forbidden", "Forbidden");
                          }

                          InputStream stream = null;
                          String resolvedPath = cleanPath;
                          try {
                              stream = getAssets().open("www/" + cleanPath);
                          } catch (IOException e) {
                              if (!cleanPath.contains(".")) {
                                  try {
                                      resolvedPath = "index.html";
                                      stream = getAssets().open("www/index.html");
                                  } catch (IOException ignored) {
                                      stream = null;
                                  }
                              }
                          }

                          if (stream == null) {
                              return textResponse(404, "Not Found", "Asset not found: " + cleanPath);
                          }

                          String mimeType = getMimeType(resolvedPath);
                          String encoding = isTextMimeType(mimeType) ? "UTF-8" : null;
                          Map<String, String> headers = new HashMap<>();
                          headers.put("Access-Control-Allow-Origin", "*");
                          headers.put("Cache-Control", "no-cache");
                          return new WebResourceResponse(mimeType, encoding, 200, "OK", headers, stream);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (request == null || request.getUrl() == null) {
                              return false;
                          }
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme() != null ? uri.getScheme().toLowerCase(Locale.ROOT) : "";
                          String host = uri.getHost() != null ? uri.getHost().toLowerCase(Locale.ROOT) : "";

                          if (LOCAL_APP_HOST.equals(host)) {
                              return false;
                          }

                          // Keep Firebase / Google / GitHub auth flows inside WebView
                          if (host.endsWith("firebaseapp.com")
                                  || host.endsWith("firebaseio.com")
                                  || host.endsWith("accounts.google.com")
                                  || host.endsWith("google.com")
                                  || host.endsWith("googleapis.com")
                                  || host.endsWith("googleusercontent.com")
                                  || host.endsWith("gstatic.com")
                                  || host.endsWith("github.com")
                                  || host.endsWith("githubusercontent.com")
                                  || host.endsWith("web.app")) {
                              return false;
                          }

                          if ("http".equals(scheme) || "https".equals(scheme) || "mailto".equals(scheme) || "tel".equals(scheme)) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, uri));
                                  return true;
                              } catch (Exception ignored) {
                                  return false;
                              }
                          }
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @SuppressLint("SetJavaScriptEnabled")
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          final Dialog popupDialog = new Dialog(MainActivity.this, android.R.style.Theme_DeviceDefault_NoActionBar);
                          final WebView popupWebView = new WebView(MainActivity.this);
                          WebSettings pSettings = popupWebView.getSettings();
                          pSettings.setJavaScriptEnabled(true);
                          pSettings.setDomStorageEnabled(true);
                          pSettings.setDatabaseEnabled(true);
                          pSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                          pSettings.setSupportMultipleWindows(true);
                          String cleanUa = webView.getSettings().getUserAgentString();
                          if (cleanUa != null) {
                              pSettings.setUserAgentString(cleanUa);
                          }

                          CookieManager cm = CookieManager.getInstance();
                          cm.setAcceptCookie(true);
                          cm.setAcceptThirdPartyCookies(popupWebView, true);

                          popupWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                                  return false;
                              }
                          });
                          popupWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  if (popupDialog.isShowing()) {
                                      popupDialog.dismiss();
                                  }
                                  popupWebView.destroy();
                              }
                          });

                          popupDialog.setContentView(
                                  popupWebView,
                                  new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                          );
                          popupDialog.setOnDismissListener(d -> popupWebView.destroy());
                          popupDialog.show();

                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(popupWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermissionRequest(request));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams fileChooserParams) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          try {
                              Intent intent = fileChooserParams.createIntent();
                              startActivityForResult(intent, REQ_FILE_CHOOSER);
                          } catch (Exception e) {
                              Intent fallbackIntent = new Intent(Intent.ACTION_GET_CONTENT);
                              fallbackIntent.addCategory(Intent.CATEGORY_OPENABLE);
                              fallbackIntent.setType("*/*");
                              startActivityForResult(Intent.createChooser(fallbackIntent, "Select File"), REQ_FILE_CHOOSER);
                          }
                          return true;
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                          if (url == null || !url.startsWith("http")) {
                              return;
                          }
                          try {
                              DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                              req.setMimeType(mimeType);
                              req.addRequestHeader("User-Agent", userAgent);
                              String filename = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              req.setTitle(filename);
                              req.setDescription("Downloading from Automate AI");
                              req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename);
                              DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              if (dm != null) {
                                  dm.enqueue(req);
                                  Toast.makeText(MainActivity.this, "Downloading " + filename, Toast.LENGTH_SHORT).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Download failed", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  webView.loadUrl(START_URL);
              }

              private WebResourceResponse textResponse(int statusCode, String reason, String body) {
                  byte[] bytes = body.getBytes(StandardCharsets.UTF_8);
                  return new WebResourceResponse(
                          "text/plain",
                          "UTF-8",
                          statusCode,
                          reason,
                          null,
                          new ByteArrayInputStream(bytes)
                  );
              }

              private String getMimeType(String path) {
                  String lower = path.toLowerCase(Locale.ROOT);
                  if (lower.endsWith(".html")) return "text/html";
                  if (lower.endsWith(".js") || lower.endsWith(".mjs")) return "application/javascript";
                  if (lower.endsWith(".css")) return "text/css";
                  if (lower.endsWith(".json") || lower.endsWith(".webmanifest") || lower.endsWith(".map")) return "application/json";
                  if (lower.endsWith(".png")) return "image/png";
                  if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "image/jpeg";
                  if (lower.endsWith(".svg")) return "image/svg+xml";
                  if (lower.endsWith(".webp")) return "image/webp";
                  if (lower.endsWith(".gif")) return "image/gif";
                  if (lower.endsWith(".ico")) return "image/x-icon";
                  if (lower.endsWith(".woff2")) return "font/woff2";
                  if (lower.endsWith(".woff")) return "font/woff";
                  if (lower.endsWith(".ttf")) return "font/ttf";
                  if (lower.endsWith(".mp3")) return "audio/mpeg";
                  if (lower.endsWith(".mp4")) return "video/mp4";
                  if (lower.endsWith(".txt")) return "text/plain";
                  return "application/octet-stream";
              }

              private boolean isTextMimeType(String mimeType) {
                  return mimeType.startsWith("text/")
                          || "application/javascript".equals(mimeType)
                          || "application/json".equals(mimeType)
                          || "image/svg+xml".equals(mimeType);
              }

              private void handleWebPermissionRequest(PermissionRequest request) {
                  List<String> needed = new ArrayList<>();
                  for (String res : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)
                              && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.RECORD_AUDIO);
                      }
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res)
                              && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.CAMERA);
                      }
                  }
                  if (needed.isEmpty()) {
                      request.grant(request.getResources());
                  } else {
                      pendingPermissionRequest = request;
                      requestPermissions(needed.toArray(new String[0]), REQ_MEDIA_PERMISSIONS);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_MEDIA_PERMISSIONS && pendingPermissionRequest != null) {
                      pendingPermissionRequest.grant(pendingPermissionRequest.getResources());
                      pendingPermissionRequest = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE_CHOOSER) {
                      if (filePathCallback == null) {
                          return;
                      }
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "ERROR: keytool not found in JAVA_HOME (${JAVA_HOME})." >&2
            exit 1
          fi

          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "ERROR: Failed to generate ./debug.keystore." >&2
                exit 1
              }
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore is missing or empty after generation." >&2
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at: ${EXPECTED_APK}" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:" >&2
              find app/build/outputs/apk -type f -name '*.apk' >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: ${EXPECTED_APK} exists but is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: ${EXPECTED_APK} is empty." >&2
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: ${EXPECTED_APK} does not have the .apk extension." >&2
            exit 1
          fi

          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ] || [[ "$SOURCE_APK" != *.apk ]]; then
            echo "ERROR: Verified APK missing or invalid at ${SOURCE_APK}." >&2
            exit 1
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          ASSET_FILENAME="Automate-AI-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Prepared release asset is invalid: ${ASSET_PATH}" >&2
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available." >&2
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Prepared release asset is missing or invalid: ${ASSET_PATH:-<empty>}" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Automate AI Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          printf '%s\n' \
            "### Automate AI Debug APK" \
            "" \
            "- This is an automatically generated debug APK for **Automate AI**." \
            "- The APK was built by GitHub Actions." \
            "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- The APK is intended for testing." \
            "- The APK is not a Play Store production release." \
            "- The APK is signed only with a temporary debug keystore." > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Automate AI Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"

            {
              echo "## Automate AI Debug APK Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\`"
              echo "- **GitHub Release Page:** ${RELEASE_URL}"
              echo "- Download the APK directly from the **Assets** section on the GitHub Release page."
              echo "- The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${UPLOAD_OUTCOME}" = "success" ]; then
            echo "::warning::Automate AI APK build and Actions artifact upload succeeded, but publishing the GitHub Release failed. Download the backup artifact 'app-debug-apk' from this workflow run."
            echo "APK build succeeded."
            echo "Actions artifact 'app-debug-apk' remains available."

            {
              echo "## Automate AI Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** GitHub Release publishing did not succeed, but the debug APK build completed cleanly."
              echo ""
              echo "- The Automate AI debug APK build succeeded."
              echo "- The normal GitHub Actions artifact named \`app-debug-apk\` remains available for download from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Automate AI Debug APK Build Failed"
              echo ""
              echo "- The debug APK build or verification did not complete, so no release was published."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary debug keystore
        if: always()
        shell: bash
        run: |
          rm -f ./debug.keystore
